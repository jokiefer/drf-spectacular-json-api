[tox]
requires =
    tox>=4
env_list = 
    # three rows instead of one cross product, because 20 of its combinations cannot run:
    # Django 6.0 declares Requires-Python>=3.12, so no py310/py311 environment of it can be
    # installed, and Django 4.0 imports the `cgi` module which Python 3.13 removed, so no
    # py313/py314 environment of it imports. Measured in #53, together with the option of
    # keeping the latter by installing the legacy-cgi backport.
    py{310,311,312}-django{40,41,42,50,51,52}-drf-spectacular{25,26,27,28,29}
    py{312,313,314}-django60-drf-spectacular{25,26,27,28,29}
    py31{3,4}-django{41,42,50,51,52}-drf-spectacular{25,26,27,28,29}

[testenv]
description = run unit tests
deps=
    drf-spectacular29: drf-spectacular>=0.29.0,<0.30.0
    drf-spectacular28: drf-spectacular>=0.28.0,<0.29.0
    drf-spectacular27: drf-spectacular>=0.27.0,<0.28.0
    drf-spectacular26: drf-spectacular>=0.26.0,<0.27.0
    drf-spectacular25: drf-spectacular>=0.25.0,<0.26.0
    django60: Django>=6.0,<6.1
    django52: Django>=5.2,<5.3
    django51: Django>=5.1,<5.2
    django50: Django>=5.0,<5.1
    django42: Django>=4.2,<4.3
    django41: Django>=4.1,<4.2
    django40: Django>=4.0,<4.1
    djangorestframework>=3.13
    djangorestframework-jsonapi>=6.0.0
    djangorestframework-jsonapi[django-filter]>=6.0.0

setenv =
    PYTHONPATH = {toxinidir}

commands =
    python manage.py test {posargs}